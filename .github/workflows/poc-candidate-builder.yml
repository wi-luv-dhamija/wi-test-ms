name: POC - Build Release Candidate
run-name: Candidate ${{ inputs.candidate_id }} (PRs ${{ inputs.prs }}) → ${{ inputs.stage }}

# Combines the latest main with an ordered list of PRs, validating each cumulative state:
#   main + A, main + A + B, main + A + B + C
# Output is a candidate manifest, or a diagnosis report on TEST_FAILED (failed tests, likely
# related PRs) or MERGE_CONFLICT (conflicted files, overlapping PRs, pairwise merge checks), with
# suggested collaborators.
# With a stage (develop/qa), a validated candidate is then tagged `<stage>/rc-<run number>` and
# deployed to that environment. Nothing is ever merged or pushed to a branch.
on:
  workflow_dispatch:
    inputs:
      candidate_id:
        description: 'Candidate ID (letters, digits, . _ -), e.g. poc-001'
        required: true
        type: string
      prs:
        description: 'Ordered comma-separated PR numbers, e.g. 12,15,18'
        required: true
        type: string
      stage:
        description: 'Environment to deploy a validated candidate to (none = validate only)'
        required: false
        default: none
        type: choice
        options: [none, develop, qa]

permissions:
  contents: read
  pull-requests: read

jobs:
  build-candidate:
    name: Build candidate ${{ inputs.candidate_id }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Inputs reach scripts only through env, never interpolated into shell code.
      CANDIDATE_ID: ${{ inputs.candidate_id }}
      PRS_INPUT: ${{ inputs.prs }}
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Capture baseline
        run: |
          mkdir -p "$RUNNER_TEMP/poc-state"
          # Scripts come from the ref this run was dispatched from (so tooling changes can be
          # tried from a branch), copied out so merged PRs can't swap them mid-run.
          # The candidate itself always starts from main.
          mkdir -p "$RUNNER_TEMP/poc-scripts"
          git archive "$GITHUB_SHA" scripts/poc | tar -x -C "$RUNNER_TEMP/poc-scripts" --strip-components=2
          base_sha=$(git rev-parse HEAD)
          base_tree=$(git rev-parse 'HEAD^{tree}')
          echo "BASE_MAIN_SHA=$base_sha" >> "$GITHUB_ENV"
          echo "BASE_MAIN_TREE_SHA=$base_tree" >> "$GITHUB_ENV"
          echo "Candidate: $CANDIDATE_ID"
          echo "Base main: $base_sha"
          echo "Base tree: $base_tree"
          echo "PRs: $PRS_INPUT"

      - name: Validate PR input
        env:
          GH_TOKEN: ${{ github.token }}
        run: '"$RUNNER_TEMP/poc-scripts/validate-prs.sh"'

      - name: Fetch PR snapshots
        env:
          GH_TOKEN: ${{ github.token }}
        run: '"$RUNNER_TEMP/poc-scripts/fetch-snapshots.sh"'

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # Runs untrusted PR code: no token or secrets in this step's environment.
      - name: Assemble and validate candidate
        run: '"$RUNNER_TEMP/poc-scripts/build-candidate.sh"'

      - name: Check for stale PRs or main
        env:
          GH_TOKEN: ${{ github.token }}
        run: '"$RUNNER_TEMP/poc-scripts/check-staleness.sh"'

      - name: Create candidate manifest
        run: '"$RUNNER_TEMP/poc-scripts/create-manifest.sh"'

      - name: Upload candidate manifest
        uses: actions/upload-artifact@v7
        with:
          name: candidate-manifest-${{ inputs.candidate_id }}
          path: ${{ runner.temp }}/poc-state/candidate-manifest.json
          if-no-files-found: error

      - name: Upload build output
        if: inputs.stage != 'none'
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ inputs.candidate_id }}
          path: dist
          if-no-files-found: error

      # Each script exits early unless the failure type is the one it diagnoses.
      - name: Diagnose failure
        id: diagnose
        if: failure()
        run: |
          node "$RUNNER_TEMP/poc-scripts/diagnose-merge-conflict.mjs"
          node "$RUNNER_TEMP/poc-scripts/diagnose-test-failure.mjs"

      - name: Upload failure diagnosis
        if: failure() && steps.diagnose.outputs.diagnosed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: candidate-diagnosis-${{ inputs.candidate_id }}
          path: |
            ${{ runner.temp }}/poc-state/vitest-report.json
            ${{ runner.temp }}/poc-state/candidate-test-diagnosis.json
            ${{ runner.temp }}/poc-state/candidate-merge-diagnosis.json
          if-no-files-found: ignore

      - name: Write job summary
        if: always()
        run: |
          if [ -x "$RUNNER_TEMP/poc-scripts/write-summary.sh" ]; then
            "$RUNNER_TEMP/poc-scripts/write-summary.sh"
          else
            echo "## Candidate $CANDIDATE_ID - FAILED (before setup; see logs)" >> "$GITHUB_STEP_SUMMARY"
          fi

  # No PR code runs here, so this job can hold the write token.
  deploy:
    name: Deploy ${{ inputs.candidate_id }} to ${{ inputs.stage }}
    needs: build-candidate
    if: inputs.stage != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.stage }}
    permissions:
      contents: write # push the candidate tag
    env:
      CANDIDATE_ID: ${{ inputs.candidate_id }}
      STAGE: ${{ inputs.stage }}
      TAG: ${{ inputs.stage }}/rc-${{ github.run_number }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download candidate manifest
        uses: actions/download-artifact@v7
        with:
          name: candidate-manifest-${{ inputs.candidate_id }}
          path: ${{ runner.temp }}/poc-state

      - name: Download build output
        uses: actions/download-artifact@v7
        with:
          name: dist-${{ inputs.candidate_id }}
          path: ${{ runner.temp }}/dist

      # Merges the same snapshots in the same order (no checks run) and requires the exact SHA
      # that was validated, so the tag can only point at tested code.
      - name: Recreate the validated candidate commit
        run: |
          mkdir -p "$RUNNER_TEMP/poc-scripts"
          git archive "$GITHUB_SHA" scripts/poc | tar -x -C "$RUNNER_TEMP/poc-scripts" --strip-components=2
          manifest="$RUNNER_TEMP/poc-state/candidate-manifest.json"
          jq .prs "$manifest" >"$RUNNER_TEMP/poc-state/prs.json"
          expected=$(jq -r .candidate_sha "$manifest")
          export BASE_MAIN_SHA=$(jq -r .base_main_sha "$manifest")
          "$RUNNER_TEMP/poc-scripts/fetch-snapshots.sh"
          MERGE_ONLY=1 "$RUNNER_TEMP/poc-scripts/build-candidate.sh"
          actual=$(git rev-parse HEAD)
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::Recreated candidate $actual does not match the validated $expected."
            exit 1
          fi
          echo "CANDIDATE_SHA=$actual" >>"$GITHUB_ENV"

      - name: Tag the candidate
        run: git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}" "$CANDIDATE_SHA:refs/tags/$TAG"

      # ponytail: placeholder deploy. Replace with the stage's real deployment of
      # $RUNNER_TEMP/dist (or trigger Jenkins/Argo with $TAG).
      - name: Deploy to ${{ inputs.stage }}
        run: |
          echo "Deploying $TAG ($CANDIDATE_SHA) to the $STAGE environment:"
          find "$RUNNER_TEMP/dist" -type f | head -20

      - name: Record the deployment
        run: |
          jq -n --arg tag "$TAG" --arg stage "$STAGE" --arg sha "$CANDIDATE_SHA" \
            --arg candidate_id "$CANDIDATE_ID" --arg at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{tag: $tag, stage: $stage, candidate_id: $candidate_id, candidate_sha: $sha, deployed_at: $at}' \
            >"$RUNNER_TEMP/deployment.json"
          {
            echo "## Deployed $TAG to $STAGE"
            echo
            echo "Candidate \`$CANDIDATE_ID\` · commit \`$CANDIDATE_SHA\`"
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Upload deployment record
        uses: actions/upload-artifact@v7
        with:
          name: candidate-deployment-${{ inputs.candidate_id }}
          path: ${{ runner.temp }}/deployment.json
          if-no-files-found: error
